<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanguageCards</title>
    <style>
        /* Базовые стили */
        body {
            font-family: Arial, sans-serif;
            background-color: #2b2b36;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .app-box {
            background-color: #3c3c4a;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #a855f7;
            margin-top: 0;
        }

        /* Контейнер для карточки */
        .card-scene {
            width: 100%;
            height: 200px;
            perspective: 600px;
            margin: 20px 0;
            cursor: pointer;
        }

        /* Сама карточка */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        /* Класс для переворота */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Общие стили для обеих сторон */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Лицевая сторона (Английское слово) */
        .card-front {
            background-color: #10b981;
            font-size: 26px;
            font-weight: bold;
        }

        /* Задняя сторона (Перевод) */
        .card-back {
            background-color: #8b5cf6;
            transform: rotateY(180deg);
            font-size: 24px;
            font-weight: bold;
        }

        /* Кнопки */
        button {
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-red { background-color: #ef4444; flex: 1; }
        .btn-green { background-color: #10b981; flex: 1; }

        .progress-text {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="app-box">
        <h1>LanguageCards</h1>
        
        <div class="progress-text">Выучено слов: <span id="counter">0</span></div>

        <!-- Блок карточки -->
        <div class="card-scene" onclick="flipCard()">
            <div class="card" id="myCard">
                <!-- Передняя сторона -->
                <div class="card-face card-front">
                    <div id="word">Слово</div>
                    <div style="font-size: 12px; margin-top: 10px; color: #aaa;">(Кликни, чтобы перевернуть)</div>
                </div>
                <!-- Задняя сторона -->
                <div class="card-face card-back">
                    <div id="translation">Перевод</div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-red" onclick="nextWord()">Не знаю</button>
            <button class="btn-green" onclick="nextWord()">Знаю</button>
        </div>
    </div>

    <script>
        // Массив слов
        var words = [
            { eng: "Negotiate", rus: "Вести переговоры" },
            { eng: "Ambiguous", rus: "Двусмысленный" },
            { eng: "Resilient", rus: "Устойчивый" }
        ];

        var currentIndex = 0;
        var learned = 0;

        // Функция переворота
        function flipCard() {
            var card = document.getElementById('myCard');
            card.classList.toggle('flipped');
        }

        // Обновление экрана
        function updateScreen() {
            var card = document.getElementById('myCard');
            card.classList.remove('flipped'); // Возвращаем лицом вперед

            if (currentIndex < words.length) {
                var currentWord = words[currentIndex];
                document.getElementById('word').innerText = currentWord.eng;
                document.getElementById('translation').innerText = currentWord.rus;
            } else {
                document.getElementById('word').innerText = "Конец!";
                document.getElementById('translation').innerText = "Вы все выучили!";
            }
        }

        // Переход к следующему слову
        function nextWord() {
            if (currentIndex < words.length) {
                learned++;
                document.getElementById('counter').innerText = learned;
                
                currentIndex++;
                updateScreen();
            }
        }

        // Запуск
        updateScreen();
    </script>
</body>
</html>
